spring.application.name=kkokjaba
server.port=8081

# 비밀번호는 git에 올리지 않는 config/local.properties 에서 읽는다 (없으면 환경변수 DB_PASSWORD)
spring.config.import=optional:file:./config/local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/kkokjaba?serverTimezone=Asia/Seoul
spring.datasource.username=kkokjaba
spring.datasource.password=${DB_PASSWORD:}

# 테이블은 Flyway(src/main/resources/db/migration)가 만든다.
# Hibernate는 아무것도 바꾸지 않고, 엔티티와 실제 테이블이 맞는지 "검사만" 한다. 다르면 앱이 뜨지 않는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 화면 파일(js, css)은 매번 서버에 "바뀌었는지" 묻게 한다. 안 바뀌었으면 304로 캐시를 그대로 쓰고,
# 바뀌었으면 새 파일을 받는다. 이게 없으면 배포 후에도 브라우저가 옛 app.js를 계속 쓸 수 있다.
spring.web.resources.cache.cachecontrol.no-cache=true

# 네이버 지도 Client ID (네이버 클라우드 플랫폼 > Maps > Application). config/local.properties 나 환경변수로 넣는다.
# 비어 있으면 화면은 네이버 지도 대신 간이 지도로 그린다.
kkokjaba.map.naver-key-id=${NAVER_MAP_KEY_ID:}
